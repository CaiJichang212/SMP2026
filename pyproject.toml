[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smp2026-starnet"
version = "0.2.0"
description = "SMP 2026 星网干预赛题的可复现实验与提交构建工程"
requires-python = ">=3.11"
dependencies = [
    "casevo",
    "networkx>=3.6.1",
    "requests>=2.34.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
casevo = { path = "../casevo", editable = true }
